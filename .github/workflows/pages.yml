name: Frontend / GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Build Pages bundle
        if: github.event_name != 'pull_request'
        env:
          SERVER_ADDR: ${{ vars.SERVER_ADDR }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_HTTPS_PORT: ${{ vars.SERVER_HTTPS_PORT || '50027' }}
        run: npm run build:pages
      - run: npm run check:build
      - name: Upload Pages bundle
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish bundle
        id: deployment
        uses: actions/deploy-pages@v4
